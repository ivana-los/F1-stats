
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>F1-Stats</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="header">
    <div class="nav">
        <ul>
            <li>Home</li>
            <li>Drivers</li>
            <li>Races</li>
            <li>Stats
            <li>Predictions</li>
            <li>Customize</li>

        </ul>
    </div>
</div>
<div class="grid">
    {% for driver in drivers %}
    <div>
        <img src="{{ driver.headshot_url }}" width="120">
        <h3>{{ driver.full_name }}</h3>
        <p>{{ driver.team_name }}</p>
    </div>
{% endfor %}
</div>

</body>
</html>
